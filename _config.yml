title: Kimty Bui-Van
description: >-
  Regulatory Affairs Executive sharing reflections on agentic AI,
  human value, digital exhaustion, and how organizations learn and evolve.
theme: minima
lang: en

header_pages:
  - index.md
  - fr/index.md

minima:
  date_format: "%Y-%m-%d"

defaults:
  - scope:
      path: "en"
      type: "posts"
    values:
      lang: en
      layout: bilingual
      permalink: /en/:title/
  - scope:
      path: "fr"
      type: "posts"
    values:
      lang: fr
      layout: bilingual
      permalink: /fr/:title/
