s1:
  banner: /assets/img/banner-s1.JPG
  en:
    title: "Season 1 — Shaping the Future of Work"
    banner_alt: "Season 1 banner: “Agentic AI: Shaping the Future of Work”, two silhouettes facing a network sphere. Visual generated with AI assistance."
    description: >-
      Twelve episodes on preparing for agentic AI: data, governance,
      teams, front-line managers, training, and measuring what really
      changes. The season closes with an overview of regulatory
      authorities facing AI.
  fr:
    title: "Saison 1 — Façonner le travail de demain"
    banner_alt: "Bandeau de la saison 1 : « Agentic AI: Shaping the Future of Work », deux silhouettes face à une sphère en réseau. Visuel généré avec l'aide de l'IA."
    description: >-
      Douze épisodes sur la préparation à l'IA agentique : les données,
      la gouvernance, les équipes, les managers de proximité, la
      formation, et la mesure de ce qui change vraiment. La saison se
      clôt sur un panorama des autorités réglementaires face à l'IA.

s2:
  banner: /assets/img/banner-s2.JPG
  en:
    title: "Season 2 — Working with it"
    status: "Season currently being published."
    banner_alt: "Season 2 banner: “Agentic AI: Working with it”, two silhouettes facing a network sphere. Visual generated with AI assistance."
    description: >-
      Ten episodes on what working with agentic AI changes day to day:
      AI biases in a regulated environment, the inflation of signals,
      deskilling, and what organizations try in response.
  fr:
    title: "Saison 2 — Composer avec"
    status: "Saison en cours de publication."
    banner_alt: "Bandeau de la saison 2 : « Agentic AI: Working with it », deux silhouettes face à une sphère en réseau. Visuel généré avec l'aide de l'IA."
    description: >-
      Dix épisodes sur ce que le travail avec l'IA agentique change au
