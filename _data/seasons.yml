s1:
  en:
    title: "Season 1 — Shaping the Future of Work"
    description: >-
      Twelve episodes on preparing for agentic AI: data, governance,
      teams, front-line managers, training, and measuring what really
      changes. The season closes with an overview of regulatory
      authorities facing AI.
  fr:
    title: "Saison 1 — Façonner le travail de demain"
    description: >-
      Douze épisodes sur la préparation à l'IA agentique : les données,
      la gouvernance, les équipes, les managers de proximité, la
      formation, et la mesure de ce qui change vraiment. La saison se
      clôt sur un panorama des autorités réglementaires face à l'IA.
